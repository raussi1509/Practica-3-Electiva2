<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola Mundo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: whitesmoke;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    div {
      background: #161b22;
      border: 1px solid darkslategray;
      padding: 3rem 2rem;
      border-radius: 16px;
    }
    h1 {
      margin: 0;
      font-size: 3rem;
      color: white;
    }
    h1 span { color: yellow; }
    p {
      margin-top: 1rem;
      color: gray;
    }
    p span { color: yellow; }
  </style>
</head>
<body>
  <div>
    <h1>Hola, <span>Mundo.</span></h1>
    <p>Página desplegada con <span>GitHub Pages</span></p>
  </div>
</body>
</html>
